[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ann-for-multi-curves"
version = "0.1.0"
description = "Shifted-grid locality-sensitive hashing and blocking for multi-curve retrieval"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.4",
    "numba==0.65.1",
    "matplotlib==3.10.8",
    "pillow==12.2.0",
    "ijson==3.6.0",
    "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pandas>=2.2", "scipy>=1.14"]
hnsw = ["hnswlib==0.8.0"]

[tool.setuptools.packages.find]
include = ["curveset*", "fresh*", "reproducibility*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
